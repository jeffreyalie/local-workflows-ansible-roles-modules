name: "Terraform Plan"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (e.g dev/prod ) must match folder name, e.g. terraform/env/dev or terraform/env/prod)"
        required: true
        type: string

      vm_name:
        description: "VM name ( e.g. dev01 / prod01 ) must match tfvars file, e.g. dev01.tfvars / prod01.tfvars"
        required: true

jobs:
  terraform:
    runs-on: ubuntu-latest

    # S3 credentials for the SeaweedFS backend. Terraform reads these from the
    # environment, so they are available to both `init` and `plan` and are never
    # written into .terraform/ on disk.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Set + Validate Variables
      # -------------------------------------------------------------------
      - name: Set Variables
        id: vars
        run: |
          ENV=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          VM="${{ inputs.vm_name }}"

          # Validate environment
          if [ "$ENV" != "dev" ] && [ "$ENV" != "prod" ]; then
            echo "::error:: Invalid environment: $ENV (allowed: dev, prod)"
            exit 1
          fi

          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "vm_name=$VM" >> $GITHUB_OUTPUT

          echo "working_dir=terraform/env/${ENV}" >> $GITHUB_OUTPUT
          echo "tfvars_file=${VM}.tfvars" >> $GITHUB_OUTPUT
          echo "state_key=state/${ENV}/${VM}/terraform.tfstate" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------------
      # Validate tfvars exists
      # -------------------------------------------------------------------
      - name: Validate tfvars exists
        working-directory: ${{ steps.vars.outputs.working_dir }}
        run: |
          FILE="${{ steps.vars.outputs.tfvars_file }}"
          if [ ! -f "$FILE" ]; then
            echo "::error:: tfvars file not found: $FILE"
            exit 1
          fi

      # -------------------------------------------------------------------
      # Setup Terraform (use_lockfile below needs Terraform >= 1.10)
      # -------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -------------------------------------------------------------------
      # Setup LXD certificates (optional if using password auth, but recommended for security)
      # Provider will automatically pick up certs from ~/.config/lxc/ if they exist, defined in workflow secrets LXD_CLIENT_CERT and LXD_CLIENT_KEY
      # -------------------------------------------------------------------
      - name: Setup LXD Certs
        if: ${{ secrets.LXD_CLIENT_CERT != '' && secrets.LXD_CLIENT_KEY != '' }}
        run: |
          mkdir -p ~/.config/lxc

          printf "%s" "${{ secrets.LXD_CLIENT_CERT }}" > ~/.config/lxc/client.crt
          printf "%s" "${{ secrets.LXD_CLIENT_KEY }}"  > ~/.config/lxc/client.key

          chmod 600 ~/.config/lxc/client.key

      # -------------------------------------------------------------------
      # Init (S3 backend on SeaweedFS)
      # Non-secret settings go in a generated backend.hcl file. The access and
      # secret keys come from the job-level AWS_* environment variables.
      # -------------------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ steps.vars.outputs.working_dir }}
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "tfstate"
          key    = "${{ steps.vars.outputs.state_key }}"
          region = "us-east-1"

          endpoints = { s3 = "${S3_ENDPOINT}" }

          use_path_style              = true
          use_lockfile                = true
          skip_credentials_validation = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_s3_checksum            = true
          EOF

          terraform init -backend-config=backend.hcl

      # -------------------------------------------------------------------
      # Validate Terraform config
      # -------------------------------------------------------------------
      - name: Terraform Validate
        working-directory: ${{ steps.vars.outputs.working_dir }}
        run: terraform validate

      # -------------------------------------------------------------------
      # Plan
      # -------------------------------------------------------------------
      - name: Terraform Plan
        working-directory: ${{ steps.vars.outputs.working_dir }}
        # Set TF_VAR_ environment variables for Terraform from GitHub Secrets and Inputs as defined in variables.tf
        env:
          TF_VAR_lxd_address: ${{ secrets.LXD_ADDRESS }}
          TF_VAR_ansible_ssh_public_key: ${{ secrets.ANSIBLE_SSH_PUBLIC_KEY }}
          # TF_VAR_environment: ${{ github.event.inputs.environment }} --- IGNORE  if using lxd certificate ---
          TF_VAR_environment: ${{ github.event.inputs.environment }}
          TF_VAR_vm_name: ${{ github.event.inputs.vm_name }}
        run: |
          terraform plan \
            -var-file="${{ steps.vars.outputs.tfvars_file }}"
