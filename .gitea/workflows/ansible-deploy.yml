name: "Ansible Deploy (Real VM)"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (dev/prod)"
        required: true

      vm_name:
        description: "VM name (e.g. dev01 / prod01)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # S3 credentials for the SeaweedFS backend. Terraform reads these from the
    # environment, so they are available to both `init` and `plan` and are never
    # written into .terraform/ on disk.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    env:
      TF_VAR_lxd_address: ${{ secrets.LXD_ADDRESS }}
      TF_VAR_ansible_ssh_public_key: ${{ secrets.ANSIBLE_SSH_PUBLIC_KEY }}

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout Repo
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Validate Environment
      # --------------------------------------------------
      - name: Validate Environment
        run: |
          ENV="${{ inputs.environment }}"

          if [ "$ENV" != "dev" ] && [ "$ENV" != "prod" ]; then
            echo "::error:: Invalid environment: $ENV (must be dev or prod)"
            exit 1
          fi

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible netcat-openbsd

      # --------------------------------------------------
      # Set Variables
      # --------------------------------------------------
      - name: Set Variables
        id: vars
        run: |
          ENV="${{ inputs.environment }}"
          VM="${{ inputs.vm_name }}"

          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "vm_name=$VM" >> $GITHUB_OUTPUT

          echo "working_dir=terraform/env/${ENV}" >> $GITHUB_OUTPUT
          echo "state_key=state/${ENV}/${VM}/terraform.tfstate" >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -------------------------------------------------------------------
      # Init (S3 backend on SeaweedFS)
      # Non-secret settings go in a generated backend.hcl file. The access and
      # secret keys come from the job-level AWS_* environment variables.
      # -------------------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ steps.vars.outputs.working_dir }}
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "tfstate"
          key    = "${{ steps.vars.outputs.state_key }}"
          region = "us-east-1"

          endpoints = { s3 = "${S3_ENDPOINT}" }

          use_path_style              = true
          use_lockfile                = true
          skip_credentials_validation = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_s3_checksum            = true
          EOF

          terraform init -backend-config=backend.hcl

      # --------------------------------------------------
      # Get VM IP from Terraform state
      # --------------------------------------------------
      - name: Get VM IP
        id: tfout
        working-directory: ${{ steps.vars.outputs.working_dir }}
        run: |
          IP=$(terraform output -raw vm_ip)
          echo "vm_ip=$IP" >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # Wait for SSH
      # --------------------------------------------------
      - name: Wait for SSH
        run: |
          for i in {1..20}; do
            nc -z ${{ steps.tfout.outputs.vm_ip }} 22 && exit 0
            echo "Waiting for SSH..."
            sleep 10
          done

          echo "::error:: SSH not ready"
          exit 1

      # --------------------------------------------------
      # Setup SSH Key
      # --------------------------------------------------
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa
          chmod 700 ~/.ssh

      # --------------------------------------------------
      # Create Inventory
      # --------------------------------------------------
      - name: Create Inventory
        run: |
          echo "[vm]" > inventory.ini
          echo "${{ steps.tfout.outputs.vm_ip }} ansible_user=ansible ansible_ssh_private_key_file=$HOME/.ssh/id_rsa" >> inventory.ini

      # --------------------------------------------------
      # Run Ansible
      # --------------------------------------------------
      - name: Ansible Deploy
        run: |
          ANSIBLE_HOST_KEY_CHECKING=False \
          ansible-playbook -i inventory.ini ansible/playbook.yml
          